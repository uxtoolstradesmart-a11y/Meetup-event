.tap{transition:border-color .2s ease,background .2s ease,transform .2s ease}

.lift{transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s ease}

<script>

const BOOKING = {
  id: 'TSM-26-04821',
  attendee: 'Aarav Sharma',

  date: 'Sat, 14 Nov 2026',
  time: '2:00 – 6:30 PM',

(function () {
  const ticket = document.getElementById('ticket');
  const card = document.getElementById('card3d');
  const foil = document.getElementById('foil');
  const glare = foil.nextElementSibling;
  const sparks = document.getElementById('sparks');
  const hint = document.getElementById('hint');
  const gyroEl = document.getElementById('gyro');
  const floor = document.getElementById('floor');
  const stage = document.getElementById('stage');
  const chip = document.getElementById('motionChip');
  const hapLabel = document.getElementById('hapSwitch').parentElement;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rx = 0, ry = 0, drag = null, active = false, pointerOn = false;
  const clamp = (v, m) => Math.max(-m, Math.min(m, v));
  const snap = (v) => Math.round(v / 180) * 180;
  const isBack = (v) => ((Math.round(v / 180) % 2) + 2) % 2 === 1;

  function render(mode) {
    card.style.transition = mode === 'drag' ? 'transform 0.04s linear'
      : mode === 'tilt' ? 'transform 0.15s ease-out'
      : 'transform 0.9s cubic-bezier(.2,1.5,.35,1)';
    card.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
    const back = isBack(ry);
    hint.textContent = back ? 'Entry pass · tap or drag to flip back'
      : gyro.on ? 'Tilt · drag to spin · tap to flip' : 'Drag to spin · tap to flip';
    ticket.setAttribute('aria-label', back ? 'Entry pass. Tap to show ticket details' : 'Ticket. Tap to show entry pass');
    ticket.style.cursor = mode === 'drag' ? 'grabbing' : 'grab';
  }
  function light(px, py, on) {
    glare.style.opacity = on ? 1 : 0;
    glare.style.background = 'radial-gradient(circle at ' + (px * 100) + '% ' + (py * 100) + '%, rgba(255,255,255,0.30), rgba(255,255,255,0) 42%)';
    foil.classList.toggle('foilIdle', !on);
    foil.style.backgroundPosition = (100 - px * 100) + '% ' + (py * 100) + '%';
  }
  function burst() {
    sparks.hidden = true;
    requestAnimationFrame(() => { sparks.hidden = false; setTimeout(() => (sparks.hidden = true), 1000); });
  }
  function flipTo(next) {
    const was = isBack(ry);
    ry = next; rx = 0; active = false;
    light(0.5, 0.3, false);
    render('spring');
    if (isBack(next) !== was) { burst(); buzz([12, 50, 6]); }
    else buzz(6);
  }
  function pos(e) {
    const r = ticket.getBoundingClientRect();
    return { px: (e.clientX - r.left) / r.width, py: (e.clientY - r.top) / r.height };
  }
  ticket.addEventListener('pointerdown', (e) => {
    pointerOn = true;
    drag = { x: e.clientX, base: snap(ry), moved: false };
    try { ticket.setPointerCapture(e.pointerId); } catch (err) {}
  });
  ticket.addEventListener('pointermove', (e) => {
    const p = pos(e);
    light(p.px, p.py, true);
    if (drag) {
      const dx = e.clientX - drag.x;
      if (Math.abs(dx) > 6) drag.moved = true;
      ry = drag.base + dx * 0.75; rx = clamp((0.5 - p.py) * 18, 14);
      render(drag.moved ? 'drag' : 'tilt');
    } else {
      const base = snap(ry), dir = isBack(base) ? -1 : 1;
      ry = base + dir * clamp((p.px - 0.5) * 34, 17); rx = clamp((0.5 - p.py) * 26, 13);
      render('tilt');
    }
  });
  const up = () => {
    const d = drag; drag = null; pointerOn = false;
    if (!d) return;
    if (!d.moved) flipTo(d.base + 180); else flipTo(snap(ry));
  };
  ticket.addEventListener('pointerup', up);
  ticket.addEventListener('pointercancel', up);
  ticket.addEventListener('pointerleave', () => { if (!drag) { pointerOn = false; rx = 0; ry = snap(ry); light(0.5, 0.3, false); render('spring'); } });
  ticket.addEventListener('click', (e) => { if (e.detail === 0) flipTo(snap(ry) + 180); }); // keyboard

  /* ---------- Haptics ----------
     Android Chrome: navigator.vibrate (needs the user to have interacted with the page once —
     true in the real flow, where they tapped "Register" in the same SPA).
     iOS Safari 18+: no vibrate API; toggling a native <input switch> produces a system haptic tick. */
  const canVibrate = typeof navigator.vibrate === 'function';
  function tickIOS() { try { hapLabel.click(); } catch (err) {} }
  function buzz(pattern) {
    if (reduced) return false;
    const p = Array.isArray(pattern) ? pattern : [pattern];
    if (canVibrate) { try { return navigator.vibrate(p); } catch (err) { return false; } }
    let t = 0;
    p.forEach((ms, i) => { if (i % 2 === 0) setTimeout(tickIOS, t); t += ms; });
    return true;
  }
  // Synced to the entrance: check pops (~0.3s), ticket lands (~0.97s) + bounce, stamp slams (~1.8s), confetti sparkle
  const CELEBRATE = [8, 660, 22, 150, 8, 640, 14, 280, 6, 140, 6];
  function celebrate() { setTimeout(() => buzz(CELEBRATE), 300); }

  function replay() {
    const names = ['dropIn', 'pop', 'drawIn', 'rise', 'stampIn', 'fall'];
    document.getAnimations().forEach((a) => {
      if (a.animationName && names.includes(a.animationName)) { a.cancel(); a.play(); }
    });
    ry = snap(ry); if (isBack(ry)) ry += 180; rx = 0; render('spring');
    celebrate();
  }
  document.getElementById('replayBtn').addEventListener('click', replay);
  celebrate(); // may be blocked until first interaction on a cold page load — see HANDOFF.md

  /* ---------- Gyro parallax ----------
     Subtle: max ±7deg, smoothed, and the neutral angle slowly re-centres to however the phone is held.
     Source 1: deviceorientation (gyroscope). Source 2 (phones without a usable gyro, or when orientation
     reports nulls): devicemotion gravity vector from the accelerometer. */
  const gyro = { on: false, src: '', bx: null, by: null, tx: 0, ty: 0, x: 0, y: 0, raf: 0, n: 0, raw: [0, 0] };
  const MAX = 7, GAIN = 0.6, RECENTER = 0.003, EASE = 0.12;
  const DEG = 180 / Math.PI;
  function screenAngle() {
    const a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
    return ((a % 360) + 360) % 360;
  }
  // gamma-like x (left/right tilt), beta-like y (front/back tilt), in degrees, corrected for landscape
  function feed(gx, by, src) {
    if (gyro.src && gyro.src !== src) return;
    gyro.src = src;
    const a = screenAngle();
    let x = gx, y = by;
    if (a === 90) { x = by; y = -gx; }
    else if (a === 270) { x = -by; y = gx; }
    else if (a === 180) { x = -gx; y = -by; }
    gyro.raw = [x, y]; gyro.n++;
    if (gyro.bx === null) { gyro.bx = x; gyro.by = y; }
    gyro.bx += (x - gyro.bx) * RECENTER;
    gyro.by += (y - gyro.by) * RECENTER;
    gyro.tx = x - gyro.bx; gyro.ty = y - gyro.by;
    if (!gyro.on) startGyro();
  }
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    feed(e.gamma, e.beta, 'gyroscope');
  }
  function onMotion(e) {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null || g.y == null || g.z == null) return;
    if (gyro.src === 'gyroscope') return;
    if (gyro.src !== 'accelerometer' && performance.now() - listenedAt < 1200) return; // give the gyroscope first dibs
    const ios = needsPermission; // WebKit reports the opposite sign
    const k = ios ? -1 : 1;
    const gxv = g.x * k, gyv = g.y * k, gzv = g.z * k;
    feed(Math.atan2(-gxv, Math.hypot(gyv, gzv)) * DEG, Math.atan2(gyv, gzv) * DEG, 'accelerometer');
  }
  function startGyro() {
    gyro.on = true; chip.hidden = true;
    stage.classList.add('gyroOn');
    render('spring');
    const loop = () => {
      gyro.x += (gyro.tx - gyro.x) * EASE;
      gyro.y += (gyro.ty - gyro.y) * EASE;
      const ay = clamp(gyro.x * GAIN, MAX), ax = clamp(-gyro.y * GAIN, MAX);
      gyroEl.style.transform = 'rotateX(' + ax.toFixed(2) + 'deg) rotateY(' + ay.toFixed(2) + 'deg)';
      floor.style.transform = 'translateX(' + (-ay * 1.6).toFixed(1) + 'px) scaleX(' + (1 - Math.abs(ay) / 60).toFixed(3) + ')';
      if (!pointerOn) {
        const px = 0.5 + ay / (MAX * 2.4), py = 0.35 - ax / (MAX * 2.4);
        glare.style.opacity = 0.55;
        glare.style.background = 'radial-gradient(circle at ' + (px * 100).toFixed(1) + '% ' + (py * 100).toFixed(1) + '%, rgba(255,255,255,0.22), rgba(255,255,255,0) 45%)';
        foil.classList.remove('foilIdle');
        foil.style.backgroundPosition = (100 - px * 100).toFixed(1) + '% ' + (py * 100).toFixed(1) + '%';
      }
      gyro.raf = requestAnimationFrame(loop);
    };
    gyro.raf = requestAnimationFrame(loop);
  }
  let listening = false, listenedAt = 0, permState = 'not needed';
  function listen() {
    if (listening) return;
    listening = true; listenedAt = performance.now();
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('devicemotion', onMotion);
  }
  const needsPermission = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
  function askPermission() {
    if (gyro.on || listening || !needsPermission) return;
    permState = 'asking';
    const motion = (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function')
      ? DeviceMotionEvent.requestPermission().catch(() => 'error') : Promise.resolve('granted');
    Promise.all([DeviceOrientationEvent.requestPermission().catch((err) => 'error: ' + err.name), motion])
      .then(([o, m]) => {
        permState = o + ' / ' + m;
        if (o === 'granted' || m === 'granted') listen();
        else if (o === 'denied') chip.hidden = true; // an 'error' (no user gesture) leaves the chip up to try again
      });
  }
  if (!reduced && typeof DeviceOrientationEvent !== 'undefined') {
    if (needsPermission) {
      // iOS (Safari and Chrome — both WebKit): motion access needs a tap. The request must come from a
      // click/touchend, not pointerdown, or iOS rejects it as "not a user gesture".
      chip.hidden = false;
      chip.addEventListener('click', () => { askPermission(); buzz(8); });
      ticket.addEventListener('click', askPermission);
    } else {
      listen();
    }
  }

  // Add ?debug to the URL to see what the sensors report
  if (/[?&]debug\b/.test(location.search)) {
    const box = document.createElement('pre');
    box.style.cssText = 'position:fixed;left:8px;top:8px;z-index:99;margin:0;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.75);color:#3DDBB5;font:11px/1.5 "Roboto Mono",monospace;pointer-events:none;white-space:pre';
    document.body.appendChild(box);
    const tick = () => {
      box.textContent = [
        'secure ctx : ' + window.isSecureContext,
        'reduced mo : ' + reduced,
        'needs perm : ' + needsPermission + ' (' + permState + ')',
        'listening  : ' + listening,
        'source     : ' + (gyro.src || 'none yet'),
        'events     : ' + gyro.n,
        'tilt x/y   : ' + gyro.raw[0].toFixed(1) + ' / ' + gyro.raw[1].toFixed(1),
        'ticket rot : ' + (gyroEl.style.transform || '-'),
        'vibrate    : ' + canVibrate
      ].join('\n');
      requestAnimationFrame(tick);
    };
    tick();
  }

  // Toast + actions
  const toastWrap = document.getElementById('toastWrap');
  const toastText = document.getElementById('toastText');
  let t;
  function toast(msg) {
    toastText.textContent = msg; toastWrap.hidden = false;
    clearTimeout(t); t = setTimeout(() => (toastWrap.hidden = true), 2200);
  }
  const calBtn = document.getElementById('calBtn');
  calBtn.addEventListener('click', () => {
    calBtn.style.background = '#00B48E'; calBtn.style.borderColor = '#00B48E'; calBtn.style.color = '#ffffff';
    document.getElementById('calTick').hidden = false;
    document.getElementById('calIcon').hidden = true;
    document.getElementById('calLabel').textContent = 'Added';
    buzz([10, 60, 10]);
    toast('Saved to your calendar');
  });
  document.getElementById('inviteBtn').addEventListener('click', () => { buzz(10); toast('Invite link copied'); });
})();
</script>
</body>
